<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tbg-assets 入库工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f5f6f8; color: #1f2329; height: 100vh; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #e3e6eb; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; }
  header .hint { color: #8a8f99; font-size: 12px; }
  main { flex: 1; display: grid; grid-template-columns: 280px 1fr 360px; gap: 12px; padding: 12px; min-height: 0; }
  .panel { background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { font-size: 13px; padding: 10px 14px; border-bottom: 1px solid #eef0f3; color: #5b6068; font-weight: 600; }
  .panel-body { flex: 1; overflow: auto; padding: 10px 14px; }

  #dropzone { border: 2px dashed #c9ced6; border-radius: 6px; padding: 14px; text-align: center; font-size: 12px; color: #8a8f99; margin-bottom: 10px; cursor: pointer; }
  #dropzone.over { border-color: #3d7fff; background: #f0f6ff; color: #3d7fff; }
  .file-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; border: 1px solid transparent; }
  .file-item:hover { background: #f0f2f5; }
  .file-item.active { background: #e8f1ff; border-color: #3d7fff; }
  .file-item.done { opacity: .45; text-decoration: line-through; cursor: default; }
  .file-item .meta { font-size: 11px; color: #8a8f99; margin-top: 2px; }

  #preview { flex: 1; position: relative; background: linear-gradient(#fdfdfd, #eef0f3); }
  #preview canvas { display: block; }
  #preview-info { position: absolute; left: 12px; top: 10px; font-size: 12px; color: #5b6068; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; white-space: pre; }
  #preview-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aab0ba; font-size: 13px; }

  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #5b6068; margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 7px 9px; border: 1px solid #d4d8de; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #3d7fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #asset-id { font-family: Consolas, monospace; background: #f7f8fa; }
  button.primary { width: 100%; padding: 10px; background: #3d7fff; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 4px; }
  button.primary:disabled { background: #b9c6e2; cursor: not-allowed; }
  #result { margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: 6px; display: none; white-space: pre-wrap; }
  #result.ok { display: block; background: #e8f8ef; color: #1a7f45; border: 1px solid #a8e2c2; }
  #result.err { display: block; background: #fdecea; color: #c0392b; border: 1px solid #f3b3ab; }
</style>
</head>
<body>
<header>
  <h1>tbg-assets 可视化入库工具</h1>
  <span class="hint">把 glb 放进仓库 inbox/ 目录，或直接拖到左侧区域</span>
  <button onclick="loadFiles()" style="margin-left:auto;padding:6px 14px;border:1px solid #d4d8de;border-radius:6px;background:#fff;cursor:pointer;">刷新列表</button>
</header>
<main>
  <div class="panel">
    <h2>1. 选择 glb 文件</h2>
    <div class="panel-body">
      <div id="dropzone">拖拽 .glb 到这里上传<br>（或点击选择文件）</div>
      <input type="file" id="file-input" accept=".glb" multiple style="display:none">
      <div id="file-list"></div>
    </div>
  </div>

  <div class="panel">
    <h2>2. 预览检查（尺寸 / 面数自动读取）</h2>
    <div id="preview">
      <div id="preview-empty">选择左侧文件进行 3D 预览<br>（需要联网加载 three.js）</div>
      <div id="preview-info" style="display:none"></div>
    </div>
  </div>

  <div class="panel">
    <h2>3. 元数据 & 入库</h2>
    <div class="panel-body">
      <div class="row">
        <div class="field"><label>套件</label><select id="f-kit"></select></div>
        <div class="field"><label>tier</label>
          <select id="f-tier">
            <option value="component">component 构件(30分)</option>
            <option value="mass">mass 量产(40分)</option>
            <option value="hero">hero 英雄(50-60分)</option>
            <option value="primitive">primitive 手工(0分)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>一级分类</label><select id="f-top"></select></div>
        <div class="field"><label>子分类</label><select id="f-sub"></select></div>
      </div>
      <div class="field"><label>中文名</label><input id="f-name" placeholder="歇山顶·重檐 A"></div>
      <div class="field"><label>资产 id（自动生成，可改）</label><input id="asset-id"></div>
      <div class="row3">
        <div class="field"><label>宽(m)</label><input id="f-dx" type="number" step="0.1"></div>
        <div class="field"><label>高(m)</label><input id="f-dy" type="number" step="0.1"></div>
        <div class="field"><label>深(m)</label><input id="f-dz" type="number" step="0.1"></div>
      </div>
      <div class="row">
        <div class="field"><label>面数</label><input id="f-poly" type="number"></div>
        <div class="field"><label>花费积分</label><input id="f-credits" type="number" value="30"></div>
      </div>
      <div class="field"><label>标签（逗号分隔）</label><input id="f-tags" placeholder="歇山顶,重檐,殿宇"></div>
      <div class="field"><label>共享材质（逗号分隔）</label><input id="f-materials" placeholder="roof-tile/qingwa,wood/zhuqi"></div>
      <div class="row">
        <div class="field"><label>seed</label><input id="f-seed"></div>
        <div class="field"><label>task id</label><input id="f-taskid"></div>
      </div>
      <div class="field"><label>生成提示词</label><textarea id="f-prompt" rows="2"></textarea></div>
      <button class="primary" id="btn-submit" disabled onclick="submitIntake()">入库</button>
      <div id="result"></div>
    </div>
  </div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script>
  let kits = {};
  let files = [];
  let current = null;
  // window.previewHook 由 module 脚本（three.js）加载成功后注入

  // ---------- 数据 ----------
  async function loadKits() {
    const { kits: k } = await fetch("/api/kits").then(r => r.json());
    kits = k;
    const kitSel = document.getElementById("f-kit");
    kitSel.innerHTML = Object.keys(k).map(x => `<option>${x}</option>`).join("");
    updateTop();
  }
  function updateTop() {
    const kit = document.getElementById("f-kit").value;
    const tree = kits[kit]?.tree || {};
    document.getElementById("f-top").innerHTML = Object.keys(tree).map(x => `<option>${x}</option>`).join("");
    updateSub();
  }
  function updateSub() {
    const kit = document.getElementById("f-kit").value;
    const top = document.getElementById("f-top").value;
    const subs = kits[kit]?.tree?.[top] || [];
    document.getElementById("f-sub").innerHTML = subs.map(x => `<option>${x}</option>`).join("");
    updateId();
  }
  function baseName() {
    return current ? current.name.replace(/\.glb$/i, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") : "";
  }
  function updateId() {
    const kit = document.getElementById("f-kit").value;
    const sub = document.getElementById("f-sub").value;
    document.getElementById("asset-id").value = `${kit}.${sub}.${baseName()}`;
  }

  async function loadFiles() {
    const { files: f } = await fetch("/api/scan").then(r => r.json());
    files = f;
    const list = document.getElementById("file-list");
    list.innerHTML = files.length ? "" : '<div style="color:#aab0ba;font-size:12px;padding:8px;">inbox/ 与 work/production/ 下暂无 glb</div>';
    for (const f of files) {
      const div = document.createElement("div");
      div.className = "file-item" + (f.done ? " done" : "") + (current === f ? " active" : "");
      div.innerHTML = `${f.name}<div class="meta">${f.from} · ${(f.size/1024/1024).toFixed(2)} MB · ${f.mtime}</div>`;
      if (!f.done) div.onclick = () => selectFile(f);
      list.appendChild(div);
    }
  }

  function selectFile(f) {
    current = f;
    document.getElementById("btn-submit").disabled = false;
    document.getElementById("result").className = "";
    updateId();
    loadFiles();
    if (window.previewHook) window.previewHook("/api/file?path=" + encodeURIComponent(f.path));
  }

  // ---------- 上传 ----------
  const dz = document.getElementById("dropzone");
  const fi = document.getElementById("file-input");
  dz.onclick = () => fi.click();
  fi.onchange = () => uploadFiles(fi.files);
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); uploadFiles(e.dataTransfer.files); };
  async function uploadFiles(list) {
    for (const file of list) {
      if (!/\.glb$/i.test(file.name)) continue;
      await fetch("/api/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
    }
    loadFiles();
  }

  // ---------- 入库 ----------
  async function submitIntake() {
    if (!current) return;
    const res = document.getElementById("result");
    const body = {
      glb: current.path,
      id: document.getElementById("asset-id").value.trim(),
      name: document.getElementById("f-name").value.trim(),
      tier: document.getElementById("f-tier").value,
      dims: [+document.getElementById("f-dx").value, +document.getElementById("f-dy").value, +document.getElementById("f-dz").value],
      polycount: +document.getElementById("f-poly").value,
      tags: document.getElementById("f-tags").value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      materials: document.getElementById("f-materials").value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      credits: document.getElementById("f-credits").value || null,
      seed: document.getElementById("f-seed").value || null,
      task_id: document.getElementById("f-taskid").value || null,
      prompt: document.getElementById("f-prompt").value,
    };
    const r = await fetch("/api/intake", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (data.error) {
      res.className = "err"; res.textContent = "入库失败：" + data.error;
    } else {
      current.done = true;
      res.className = "ok";
      res.textContent = "已入库 → " + data.assetDir
        + (data.warnings?.length ? "\n警告：" + data.warnings.join("；") : "")
        + "\n\n剩余步骤：挂共享材质 → 生成 preview.png → git 提交";
      loadFiles();
    }
  }

  document.getElementById("f-kit").onchange = updateTop;
  document.getElementById("f-top").onchange = updateSub;
  document.getElementById("f-sub").onchange = updateId;

  loadKits(); loadFiles();
</script>

<script type="module">
  // three.js 预览（加载失败不影响表单入库）
  try {
    const THREE = await import("three");
    const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");

    const container = document.getElementById("preview");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(5, 10, 7); scene.add(dir);
    const grid = new THREE.GridHelper(20, 40, 0xcccccc, 0xe5e5e5);
    scene.add(grid);

    let model = null;
    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    new ResizeObserver(resize).observe(container); resize();
    (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

    window.previewHook = url => {
      document.getElementById("preview-empty").style.display = "none";
      new GLTFLoader().load(url, gltf => {
        if (model) { scene.remove(model); }
        model = gltf.scene; scene.add(model);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        let tris = 0;
        model.traverse(o => {
          if (o.isMesh) { const g = o.geometry; tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3; }
        });
        // 相机取景
        const r = Math.max(size.x, size.y, size.z);
        camera.position.set(center.x + r * 1.6, center.y + r * 1.1, center.z + r * 1.6);
        controls.target.copy(center);
        grid.scale.setScalar(Math.max(1, r / 5));
        // 自动填表
        document.getElementById("f-dx").value = size.x.toFixed(2);
        document.getElementById("f-dy").value = size.y.toFixed(2);
        document.getElementById("f-dz").value = size.z.toFixed(2);
        document.getElementById("f-poly").value = Math.round(tris);
        const info = document.getElementById("preview-info");
        info.style.display = "block";
        info.textContent = `尺寸: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m\n面数: ${Math.round(tris).toLocaleString()}`;
      });
    };
  } catch (e) {
    document.getElementById("preview-empty").textContent = "3D 预览加载失败（需联网），可手动填写尺寸/面数后继续入库";
  }
</script>
</body>
</html>
