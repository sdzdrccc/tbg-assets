<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tbg-assets 仓储站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f5f6f8; color: #1f2329; height: 100vh; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #e3e6eb; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; }
  header .hint { color: #8a8f99; font-size: 12px; }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr 380px; gap: 12px; padding: 12px; min-height: 0; }
  .panel { background: #fff; border: 1px solid #e3e6eb; border-radius: 8px; display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { font-size: 13px; padding: 10px 14px; border-bottom: 1px solid #eef0f3; color: #5b6068; font-weight: 600; }
  .panel-body { flex: 1; overflow: auto; padding: 10px 14px; }

  .tabs { display: flex; border-bottom: 1px solid #eef0f3; }
  .tabs button { flex: 1; padding: 9px 4px; border: none; background: none; font-size: 12px; color: #8a8f99; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.active { color: #3d7fff; border-bottom-color: #3d7fff; font-weight: 600; }
  .tabs button .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: #eef0f3; font-size: 10px; margin-left: 2px; }
  .tabs button .badge.hot { background: #ffe8e6; color: #c0392b; }

  #dropzone { border: 2px dashed #c9ced6; border-radius: 6px; padding: 14px; text-align: center; font-size: 12px; color: #8a8f99; margin-bottom: 10px; cursor: pointer; }
  #dropzone.over { border-color: #3d7fff; background: #f0f6ff; color: #3d7fff; }
  .file-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; border: 1px solid transparent; }
  .file-item:hover { background: #f0f2f5; }
  .file-item.active { background: #e8f1ff; border-color: #3d7fff; }
  .file-item.done { opacity: .45; text-decoration: line-through; cursor: default; }
  .file-item .meta { font-size: 11px; color: #8a8f99; margin-top: 2px; }
  .cat-head { font-size: 11px; color: #8a8f99; margin: 10px 0 4px; font-weight: 600; }

  #preview { flex: 1; position: relative; background: linear-gradient(#fdfdfd, #eef0f3); }
  #preview canvas { display: block; }
  #preview-info { position: absolute; left: 12px; top: 10px; font-size: 12px; color: #5b6068; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; white-space: pre; }
  #preview-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aab0ba; font-size: 13px; text-align: center; }

  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #5b6068; margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 7px 9px; border: 1px solid #d4d8de; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #3d7fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #asset-id { font-family: Consolas, monospace; background: #f7f8fa; }
  button.primary { width: 100%; padding: 10px; background: #3d7fff; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 4px; }
  button.primary:disabled { background: #b9c6e2; cursor: not-allowed; }
  #result { margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: 6px; display: none; white-space: pre-wrap; }
  #result.ok { display: block; background: #e8f8ef; color: #1a7f45; border: 1px solid #a8e2c2; }
  #result.err { display: block; background: #fdecea; color: #c0392b; border: 1px solid #f3b3ab; }
  #guess { display: none; font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; line-height: 1.6; }
  #guess.high { display: block; background: #e8f1ff; color: #1f5ccc; border: 1px solid #b3d1ff; }
  #guess.medium { display: block; background: #fff7e6; color: #a05c00; border: 1px solid #ffd591; }
  #guess.none { display: block; background: #f4f5f7; color: #5b6068; border: 1px solid #e3e6eb; }
  #guess b { font-weight: 600; }

  .kv { font-size: 12px; line-height: 1.9; }
  .kv b { color: #5b6068; font-weight: 600; display: inline-block; min-width: 72px; }
  .kv code { font-family: Consolas, monospace; background: #f7f8fa; padding: 1px 5px; border-radius: 4px; }
  .tag { display: inline-block; background: #eef2ff; color: #3d5aa0; font-size: 11px; border-radius: 4px; padding: 1px 6px; margin: 1px 2px; }
</style>
</head>
<body>
<header>
  <h1>tbg-assets 仓储站</h1>
  <span class="hint">主通道：tbg-3d 投递的资产包；兜底：裸模型上传；库内：浏览已入库资产</span>
  <button onclick="reloadAll()" style="margin-left:auto;padding:6px 14px;border:1px solid #d4d8de;border-radius:6px;background:#fff;cursor:pointer;">刷新</button>
</header>
<main>
  <div class="panel">
    <div class="tabs">
      <button id="tab-packages" class="active" onclick="switchTab('packages')">资产包<span class="badge" id="badge-packages">0</span></button>
      <button id="tab-raw" onclick="switchTab('raw')">裸模型<span class="badge" id="badge-raw">0</span></button>
      <button id="tab-library" onclick="switchTab('library')">库内资产<span class="badge" id="badge-library">0</span></button>
    </div>
    <div class="panel-body">
      <div id="pane-packages"></div>
      <div id="pane-raw" style="display:none">
        <div id="dropzone">拖拽模型文件到这里上传<br>支持 .glb / .fbx / .stl / .usdz<br>（fbx/stl/usdz 需回 tbg-3d 精修）</div>
        <input type="file" id="file-input" accept=".glb,.fbx,.stl,.usdz" multiple style="display:none">
        <div id="file-list"></div>
      </div>
      <div id="pane-library" style="display:none"></div>
    </div>
  </div>

  <div class="panel">
    <h2 id="preview-title">3D 预览</h2>
    <div id="preview">
      <div id="preview-empty">选择左侧项目进行 3D 预览<br>（需要联网加载 three.js）</div>
      <div id="preview-info" style="display:none"></div>
    </div>
  </div>

  <div class="panel">
    <h2 id="detail-title">详情</h2>
    <div class="panel-body">
      <!-- 资产包视图 -->
      <div id="view-package" style="display:none">
        <div class="kv" id="pkg-kv"></div>
        <button class="primary" id="btn-pkg-intake" onclick="intakePkg()">确认入库</button>
      </div>
      <!-- 库内资产视图 -->
      <div id="view-library" style="display:none">
        <div class="kv" id="lib-kv"></div>
      </div>
      <!-- 裸模型表单视图（原有兜底流程） -->
      <div id="view-raw" style="display:none">
        <div id="guess"></div>
        <details style="margin-bottom:10px;">
          <summary style="font-size:12px;color:#8a8f99;cursor:pointer;">识别不对？点这里手动调整分类</summary>
          <div class="row" style="margin-top:8px;">
            <div class="field"><label>套件</label><select id="f-kit"></select></div>
            <div class="field"><label>tier 等级</label>
              <select id="f-tier">
                <option value="component">component 构件(30分)</option>
                <option value="mass">mass 量产(40分)</option>
                <option value="hero">hero 英雄(50-60分)</option>
                <option value="primitive">primitive 手工(0分)</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="field"><label>一级分类</label><select id="f-top"></select></div>
            <div class="field"><label>子分类</label><select id="f-sub"></select></div>
          </div>
        </details>
        <div class="field"><label>中文名</label><input id="f-name" placeholder="歇山顶·重檐 A"></div>
        <div class="field"><label>资产 id（自动生成，可改）</label><input id="asset-id"></div>
        <div class="row3">
          <div class="field"><label>宽(m)</label><input id="f-dx" type="number" step="0.1"></div>
          <div class="field"><label>高(m)</label><input id="f-dy" type="number" step="0.1"></div>
          <div class="field"><label>深(m)</label><input id="f-dz" type="number" step="0.1"></div>
        </div>
        <div class="row">
          <div class="field"><label>面数</label><input id="f-poly" type="number"></div>
          <div class="field"><label>花费积分</label><input id="f-credits" type="number" value="30"></div>
        </div>
        <div class="field"><label>标签（逗号分隔）</label><input id="f-tags" placeholder="歇山顶,重檐,殿宇"></div>
        <div class="field"><label>共享材质（逗号分隔）</label><input id="f-materials" placeholder="roof-tile/qingwa,wood/zhuqi"></div>
        <div class="row3">
          <div class="field"><label>生成器</label>
            <select id="f-generator">
              <option value="hunyuan-3d">混元3D</option>
              <option value="tripo-p1">Tripo</option>
              <option value="blender-manual">Blender 手工</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div class="field"><label>seed</label><input id="f-seed"></div>
          <div class="field"><label>task id</label><input id="f-taskid"></div>
        </div>
        <div class="field"><label>生成提示词</label><textarea id="f-prompt" rows="2"></textarea></div>
        <button class="primary" id="btn-submit" disabled onclick="submitIntake()">入库</button>
      </div>
      <div id="view-empty" style="color:#aab0ba;font-size:12px;padding:8px;">未选择任何项目</div>
      <div id="result"></div>
    </div>
  </div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script>
  let kits = {};
  let labels = { top: {}, sub: {}, tier: {} };
  let files = [];
  let packages = [];
  let library = [];
  let current = null;       // 裸模型选中
  let currentPkg = null;    // 资产包选中
  // window.previewHook 由 module 脚本（three.js）加载成功后注入

  const topLabel = t => labels.top[t] ? `${t} · ${labels.top[t]}` : t;
  const subLabel = s => labels.sub[s] ? `${s} · ${labels.sub[s]}` : s;
  const $ = id => document.getElementById(id);

  // ---------- 视图切换 ----------
  function switchTab(tab) {
    for (const t of ["packages", "raw", "library"]) {
      $("tab-" + t).classList.toggle("active", t === tab);
      $("pane-" + t).style.display = t === tab ? "" : "none";
    }
  }
  function showView(name) {
    for (const v of ["package", "library", "raw", "empty"]) {
      $("view-" + v).style.display = v === name ? "" : "none";
    }
    $("result").className = "";
  }

  // ---------- 数据 ----------
  async function loadKits() {
    const { kits: k, labels: l } = await fetch("/api/kits").then(r => r.json());
    kits = k; if (l) labels = l;
    const kitSel = $("f-kit");
    kitSel.innerHTML = Object.keys(k).map(x => `<option>${x}</option>`).join("");
    updateTop();
  }
  function updateTop() {
    const kit = $("f-kit").value;
    const tree = kits[kit]?.tree || {};
    $("f-top").innerHTML = Object.keys(tree).map(x => `<option value="${x}">${topLabel(x)}</option>`).join("");
    updateSub();
  }
  function updateSub() {
    const kit = $("f-kit").value;
    const top = $("f-top").value;
    const subs = kits[kit]?.tree?.[top] || [];
    $("f-sub").innerHTML = subs.map(x => `<option value="${x}">${subLabel(x)}</option>`).join("");
    updateId();
  }
  function baseName() {
    return current ? current.name.replace(/\.glb$/i, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") : "";
  }
  function updateId() {
    const kit = $("f-kit").value;
    const sub = $("f-sub").value;
    $("asset-id").value = `${kit}.${sub}.${baseName()}`;
  }

  // ---------- 资产包（主通道） ----------
  async function loadPackages() {
    const { packages: p } = await fetch("/api/packages").then(r => r.json());
    packages = p;
    $("badge-packages").textContent = p.length;
    $("badge-packages").className = "badge" + (p.length ? " hot" : "");
    const list = $("pane-packages");
    list.innerHTML = p.length ? "" : '<div style="color:#aab0ba;font-size:12px;padding:8px;">inbox/ 下暂无资产包<br><br>tbg-3d 执行 pack.js 后会出现在这里</div>';
    for (const pkg of p) {
      const div = document.createElement("div");
      div.className = "file-item" + (currentPkg === pkg ? " active" : "");
      div.innerHTML = `${pkg.name}<div class="meta">${pkg.id || pkg.dir} · ${pkg.tier || "?"} · ${pkg.polycount ? pkg.polycount.toLocaleString() + " 面" : ""}</div>`;
      div.onclick = () => selectPackage(pkg);
      list.appendChild(div);
    }
  }
  function selectPackage(pkg) {
    currentPkg = pkg; current = null;
    loadPackages();
    showView("package");
    $("detail-title").textContent = "资产包详情（确认后入库）";
    $("pkg-kv").innerHTML =
      `<b>id</b> <code>${pkg.id}</code><br>` +
      `<b>中文名</b> ${pkg.name}<br>` +
      `<b>分类</b> ${pkg.category || "?"}<br>` +
      `<b>tier</b> ${pkg.tier || "?"}<br>` +
      `<b>面数</b> ${pkg.polycount ? pkg.polycount.toLocaleString() : "?"}<br>` +
      `<b>共享材质</b> ${pkg.materials.length ? pkg.materials.map(m => `<span class="tag">${m}</span>`).join("") : "（无 / 自带贴图）"}<br>` +
      `<b>溯源文件</b> ${pkg.hasSource ? "✓ source.json" : "✗ 缺失"}`;
    if (window.previewHook) window.previewHook("/api/file?path=" + encodeURIComponent(pkg.dir + "/model.glb"), "model.glb");
  }
  async function intakePkg() {
    if (!currentPkg) return;
    const res = $("result");
    const r = await fetch("/api/intake-package", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dir: currentPkg.dir }),
    });
    const data = await r.json();
    if (data.error) {
      res.className = "err"; res.textContent = "入库失败：" + data.error;
    } else {
      currentPkg = null;
      res.className = "ok";
      res.textContent = "已入库 → " + data.assetDir
        + (data.warnings?.length ? "\n警告：" + data.warnings.join("；") : "")
        + "\n\n剩余步骤：生成 preview.png → git 提交";
      loadPackages(); loadLibrary();
      showView("empty");
    }
  }

  // ---------- 裸模型（兜底通道） ----------
  async function loadFiles() {
    const { files: f } = await fetch("/api/scan").then(r => r.json());
    files = f;
    $("badge-raw").textContent = f.filter(x => !x.done).length;
    const list = $("file-list");
    list.innerHTML = files.length ? "" : '<div style="color:#aab0ba;font-size:12px;padding:8px;">inbox/ 与 work/production/ 下暂无模型文件</div>';
    for (const f of files) {
      const div = document.createElement("div");
      div.className = "file-item" + (f.done ? " done" : "") + (current === f ? " active" : "");
      const tag = f.needsRefine ? ' <span style="color:#c0392b;">待精修（可预览，不可直接入库）</span>' : "";
      div.innerHTML = `${f.name}${tag}<div class="meta">${f.from} · ${(f.size/1024/1024).toFixed(2)} MB · ${f.mtime}</div>`;
      if (!f.done) div.onclick = () => selectFile(f);
      list.appendChild(div);
    }
  }

  async function selectFile(f) {
    current = f; currentPkg = null;
    showView("raw");
    $("detail-title").textContent = "裸模型入库（兜底通道）";
    $("btn-submit").disabled = !!f.needsRefine;
    loadFiles();
    if (window.previewHook) window.previewHook("/api/file?path=" + encodeURIComponent(f.path), f.name);

    if (f.needsRefine) {
      const box = $("guess");
      box.className = "none";
      box.innerHTML = `这是 <b>${f.name.split(".").pop().toUpperCase()}</b> 格式，仅供预览检查。<br>请回 tbg-3d 走精修管线（fix-scale → refine → pack）后再来入库。`;
      return;
    }

    const g = await fetch("/api/classify?name=" + encodeURIComponent(f.name)).then(r => r.json());
    const box = $("guess");
    if (g.top) {
      $("f-kit").value = g.kit;
      updateTop();
      $("f-top").value = g.top;
      updateSub();
      $("f-sub").value = g.sub;
      $("f-tier").value = g.tier;
      $("f-credits").value = g.credits;
      const nameInput = $("f-name");
      if (!nameInput.value) nameInput.placeholder = `如：${g.nameHint} A`;
      const tagsInput = $("f-tags");
      if (!tagsInput.value) tagsInput.value = g.nameHint;
      box.className = g.confidence;
      box.innerHTML = `已自动识别为 <b>${labels.top[g.top] || g.top} → ${labels.sub[g.sub] || g.sub}</b>（${labels.tier[g.tier] || g.tier}）`
        + `<br>依据：文件名含「${g.matched}」（兜底降级识别，权威分类应在 tbg-3d 生产端确定）`
        + (g.confidence === "medium" ? "<br>关键词较短，请瞄一眼确认是否准确" : "");
    } else {
      $("f-tier").value = g.tier;
      $("f-credits").value = g.credits;
      box.className = "none";
      box.innerHTML = `文件名没有命中任何分类关键词，请展开下方手动选择一次（或把文件改名为含类别词，如 <b>roof-</b>、<b>丹炉-</b> 开头）`;
    }
    updateId();
  }

  // ---------- 库内资产浏览 ----------
  async function loadLibrary() {
    const { assets } = await fetch("/api/assets").then(r => r.json());
    library = assets;
    $("badge-library").textContent = assets.length;
    const list = $("pane-library");
    list.innerHTML = assets.length ? "" : '<div style="color:#aab0ba;font-size:12px;padding:8px;">库内暂无资产</div>';
    let lastCat = null;
    for (const a of assets) {
      if (a.category !== lastCat) {
        lastCat = a.category;
        const h = document.createElement("div");
        h.className = "cat-head";
        h.textContent = a.category;
        list.appendChild(h);
      }
      const div = document.createElement("div");
      div.className = "file-item";
      div.innerHTML = `${a.name}<div class="meta">${a.id} · ${a.tier} · ${(a.polycount || 0).toLocaleString()} 面</div>`;
      div.onclick = () => selectLibAsset(a, div);
      list.appendChild(div);
    }
  }
  function selectLibAsset(a, el) {
    document.querySelectorAll("#pane-library .file-item.active").forEach(x => x.classList.remove("active"));
    el.classList.add("active");
    showView("library");
    $("detail-title").textContent = "库内资产";
    $("lib-kv").innerHTML =
      `<b>id</b> <code>${a.id}</code><br>` +
      `<b>中文名</b> ${a.name}<br>` +
      `<b>分类</b> ${a.category}<br>` +
      `<b>tier</b> ${a.tier}<br>` +
      `<b>面数</b> ${(a.polycount || 0).toLocaleString()}<br>` +
      `<b>共享材质</b> ${a.materials.length ? a.materials.map(m => `<span class="tag">${m}</span>`).join("") : "（自带贴图）"}<br>` +
      `<b>路径</b> <code>${a.path}</code>`;
    if (window.previewHook) window.previewHook("/api/file?path=" + encodeURIComponent(a.path), "model.glb");
  }

  // ---------- 上传 ----------
  const dz = $("dropzone");
  const fi = $("file-input");
  dz.onclick = () => fi.click();
  fi.onchange = () => uploadFiles(fi.files);
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); uploadFiles(e.dataTransfer.files); };
  async function uploadFiles(list) {
    for (const file of list) {
      if (!/\.(glb|fbx|stl|usdz)$/i.test(file.name)) continue;
      await fetch("/api/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
    }
    loadFiles();
  }

  // ---------- 裸模型入库 ----------
  async function submitIntake() {
    if (!current) return;
    const res = $("result");
    const body = {
      glb: current.path,
      id: $("asset-id").value.trim(),
      name: $("f-name").value.trim(),
      tier: $("f-tier").value,
      dims: [+$("f-dx").value, +$("f-dy").value, +$("f-dz").value],
      polycount: +$("f-poly").value,
      tags: $("f-tags").value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      materials: $("f-materials").value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      credits: $("f-credits").value || null,
      generator: $("f-generator").value,
      seed: $("f-seed").value || null,
      task_id: $("f-taskid").value || null,
      prompt: $("f-prompt").value,
    };
    const r = await fetch("/api/intake", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (data.error) {
      res.className = "err"; res.textContent = "入库失败：" + data.error;
    } else {
      current.done = true;
      res.className = "ok";
      res.textContent = "已入库 → " + data.assetDir
        + (data.warnings?.length ? "\n警告：" + data.warnings.join("；") : "")
        + "\n\n剩余步骤：生成 preview.png → git 提交";
      loadFiles(); loadLibrary();
    }
  }

  $("f-kit").onchange = updateTop;
  $("f-top").onchange = updateSub;
  $("f-sub").onchange = updateId;

  function reloadAll() { loadPackages(); loadFiles(); loadLibrary(); }
  loadKits(); reloadAll();
</script>

<script type="module">
  // three.js 预览（加载失败不影响表单入库）
  try {
    const THREE = await import("three");
    const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
    const { FBXLoader } = await import("three/addons/loaders/FBXLoader.js");
    const { STLLoader } = await import("three/addons/loaders/STLLoader.js");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");

    const container = document.getElementById("preview");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(5, 10, 7); scene.add(dir);
    const grid = new THREE.GridHelper(20, 40, 0xcccccc, 0xe5e5e5);
    scene.add(grid);

    let model = null;
    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    new ResizeObserver(resize).observe(container); resize();
    (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

    function onLoaded(obj) {
      if (model) { scene.remove(model); }
      model = obj; scene.add(model);
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      let tris = 0;
      model.traverse(o => {
        if (o.isMesh) { const g = o.geometry; tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3; }
      });
      const r = Math.max(size.x, size.y, size.z);
      camera.position.set(center.x + r * 1.6, center.y + r * 1.1, center.z + r * 1.6);
      controls.target.copy(center);
      grid.scale.setScalar(Math.max(1, r / 5));
      const info = document.getElementById("preview-info");
      info.style.display = "block";
      info.textContent = `尺寸: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m\n面数: ${Math.round(tris).toLocaleString()}`;
      // 裸模型表单自动填尺寸/面数
      const dx = document.getElementById("f-dx");
      if (dx && document.getElementById("view-raw").style.display !== "none") {
        dx.value = size.x.toFixed(2);
        document.getElementById("f-dy").value = size.y.toFixed(2);
        document.getElementById("f-dz").value = size.z.toFixed(2);
        document.getElementById("f-poly").value = Math.round(tris);
      }
    }

    window.previewHook = (url, name) => {
      document.getElementById("preview-empty").style.display = "none";
      const ext = (name || url).split(".").pop().toLowerCase();
      if (ext === "fbx") {
        new FBXLoader().load(url, onLoaded);
      } else if (ext === "stl") {
        new STLLoader().load(url, geo => onLoaded(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x999999 }))));
      } else {
        new GLTFLoader().load(url, gltf => onLoaded(gltf.scene));
      }
    };
  } catch (e) {
    document.getElementById("preview-empty").textContent = "3D 预览加载失败（需联网），可手动填写尺寸/面数后继续入库";
  }
</script>
</body>
</html>
